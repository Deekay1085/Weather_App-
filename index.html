<!DOCTYPE html>
<!-- Created by Deekay1085 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>Weather</h1>

    <form id="search-form" autocomplete="off">
      <label for="city" class="sr-only">City name</label>
      <input id="city" type="text" placeholder="Search for a city" required>
      <button type="submit">Search</button>
    </form>

    <p id="message" role="status" aria-live="polite">Enter a city to see its current weather.</p>

    <section id="result" class="card" hidden>
      <h2 id="place"></h2>
      <div class="main-row">
        <span id="icon" aria-hidden="true"></span>
        <span id="temp"></span>
      </div>
      <p id="condition"></p>
      <dl class="details">
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
      </dl>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
